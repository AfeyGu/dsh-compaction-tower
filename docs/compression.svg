<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 378" width="1200" height="378" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#edf0f3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#aab3bc" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="378" fill="#ffffff"/>

  <!-- ── T2：合并好了，还没提交 ── -->
  <text x="140" y="80" text-anchor="end" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1f2328">T2</text>
  <rect x="305" y="68" width="160" height="23" rx="5" fill="#fff9e6" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="5 3.5"/>
  <text x="319" y="79.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#6b4e00">b9</text>
  <text x="449" y="79.5" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#8a6d1f">待提交</text>
  <text x="482" y="74" dominant-baseline="middle" font-size="12" fill="#57606a">由 b1–b3 的摘要合并而成</text>
  <text x="482" y="90" dominant-baseline="middle" font-size="12" fill="#8a6d1f">已经蒸好，还躺在日志里</text>

  <!-- 覆盖括号：两端向下勾住 b1–b3，中间向上托住 b9 -->
  <path d="M385,91 L385,104 M225,104 L545,104 M225,104 L225,114 M385,104 L385,114 M545,104 L545,114"
        fill="none" stroke="#c9a227" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ── T1 ── -->
  <text x="140" y="126" text-anchor="end" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1f2328">T1</text>

  <rect x="150" y="114" width="150" height="23" rx="4" fill="#1f6feb"/>
  <text x="163" y="125.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#ffffff">b1</text>
  <rect x="310" y="114" width="150" height="23" rx="4" fill="#1f6feb"/>
  <text x="323" y="125.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#ffffff">b2</text>
  <rect x="470" y="114" width="150" height="23" rx="4" fill="#1f6feb"/>
  <text x="483" y="125.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#ffffff">b3</text>

  <rect x="630" y="114" width="150" height="23" rx="4" fill="#fff9e6" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="5 3.5"/>
  <text x="643" y="125.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#6b4e00">b4</text>
  <rect x="790" y="114" width="150" height="23" rx="4" fill="#fff9e6" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="5 3.5"/>
  <text x="803" y="125.5" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#6b4e00">b5</text>
  <text x="954" y="125.5" dominant-baseline="middle" font-size="19" fill="#8c959f">…</text>

  <!-- 块 → 原文 -->
  <g stroke="#b8c0c8" stroke-width="1.1">
    <line x1="225" y1="138" x2="225" y2="146"/>
    <line x1="385" y1="138" x2="385" y2="146"/>
    <line x1="545" y1="138" x2="545" y2="146"/>
    <line x1="705" y1="138" x2="705" y2="146"/>
    <line x1="865" y1="138" x2="865" y2="146"/>
  </g>

  <!-- ── 原文：前 3 组已被替换（阴影），后 2 组还在上下文 ── -->
  <text x="140" y="158" text-anchor="end" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1f2328">原文</text>

  <g stroke="#aab3bc" stroke-width="1" fill="url(#hatch)">
    <rect x="150" y="146" width="23" height="23"/><rect x="175.4" y="146" width="23" height="23"/><rect x="200.8" y="146" width="23" height="23"/>
    <rect x="226.2" y="146" width="23" height="23"/><rect x="251.6" y="146" width="23" height="23"/><rect x="277" y="146" width="23" height="23"/>
    <rect x="310" y="146" width="23" height="23"/><rect x="335.4" y="146" width="23" height="23"/><rect x="360.8" y="146" width="23" height="23"/>
    <rect x="386.2" y="146" width="23" height="23"/><rect x="411.6" y="146" width="23" height="23"/><rect x="437" y="146" width="23" height="23"/>
    <rect x="470" y="146" width="23" height="23"/><rect x="495.4" y="146" width="23" height="23"/><rect x="520.8" y="146" width="23" height="23"/>
    <rect x="546.2" y="146" width="23" height="23"/><rect x="571.6" y="146" width="23" height="23"/><rect x="597" y="146" width="23" height="23"/>
  </g>

  <g stroke="#d0d7de" stroke-width="1" fill="#f6f8fa">
    <rect x="630" y="146" width="23" height="23"/><rect x="655.4" y="146" width="23" height="23"/><rect x="680.8" y="146" width="23" height="23"/>
    <rect x="706.2" y="146" width="23" height="23"/><rect x="731.6" y="146" width="23" height="23"/><rect x="757" y="146" width="23" height="23"/>
    <rect x="790" y="146" width="23" height="23"/><rect x="815.4" y="146" width="23" height="23"/><rect x="840.8" y="146" width="23" height="23"/>
    <rect x="866.2" y="146" width="23" height="23"/><rect x="891.6" y="146" width="23" height="23"/><rect x="917" y="146" width="23" height="23"/>
  </g>
  <text x="954" y="158" dominant-baseline="middle" font-size="19" fill="#8c959f">…</text>

  <text x="150" y="190" font-size="12" fill="#57606a">已被 b1–b3 替换 · 离开上下文</text>
  <text x="630" y="190" font-size="12" fill="#57606a">b4 b5 还没提交 · 原文照旧占着</text>

  <!-- ── 窗口 ── -->
  <text x="140" y="244" text-anchor="end" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1f2328">窗口</text>
  <rect x="150" y="232" width="900" height="24" rx="4" fill="#eef1f4"/>
  <rect x="150" y="232" width="218" height="24" rx="4" fill="#dbeafe" stroke="#1f6feb" stroke-width="1.4"/>
  <text x="259" y="244" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#0b4a9e">b1–b3 的摘要 + 最近 N 步 · 242K</text>
  <text x="1040" y="244" text-anchor="end" dominant-baseline="middle" font-size="11.5" fill="#57606a">1M</text>

  <!-- ── 图例 ── -->
  <line x1="150" y1="276" x2="1050" y2="276" stroke="#eaeef2" stroke-width="1"/>
  <rect x="150" y="288" width="15" height="11" rx="2.5" fill="#1f6feb"/>
  <text x="173" y="294" dominant-baseline="middle" font-size="11.5" fill="#1f2328">已进入上下文</text>
  <rect x="286" y="288" width="15" height="11" rx="2.5" fill="#fff9e6" stroke="#c9a227" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="309" y="294" dominant-baseline="middle" font-size="11.5" fill="#1f2328">已蒸好、待提交（只占日志）</text>
  <rect x="530" y="288" width="15" height="11" rx="2.5" fill="url(#hatch)" stroke="#aab3bc" stroke-width="1"/>
  <text x="553" y="294" dominant-baseline="middle" font-size="11.5" fill="#1f2328">已被替换（离开上下文）</text>
  <rect x="755" y="288" width="15" height="11" rx="2.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="778" y="294" dominant-baseline="middle" font-size="11.5" fill="#1f2328">原文仍在上下文</text>

  <text x="150" y="330" font-size="12" fill="#57606a">提交那一刻才发生替换：块的摘要进上下文，它盖住的原文退成阴影；没提交的块，原文一直实着。</text>
  <text x="150" y="352" font-size="12" fill="#57606a">压过的原文不会消失：decompress(b1) 按块号展开，search_context("关键词") 在全部历史里搜。</text>
</svg>
